<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; }

#diagram-container {
  position: relative;
  width: 100%;
  max-width: 680px;
  display: block;
  margin: 0 auto;
}
svg { display: block; width: 100%; height: auto; }

.clickable { cursor: pointer; }
.node-rect { transition: filter 0.15s ease; }
.clickable:hover .node-rect {
  filter: brightness(1.14) drop-shadow(0 0 7px rgba(0,0,0,0.28));
}
.arrow-line { transition: opacity 0.15s ease; }
.clickable:hover .arrow-line { opacity: 0.65; }
.arrow-hit { fill: none; stroke: transparent; stroke-width: 18; }

#popup {
  display: none;
  position: absolute;
  width: 262px;
  background: white;
  border-radius: 9px;
  box-shadow: 0 5px 24px rgba(0,0,0,0.15), 0 1px 5px rgba(0,0,0,0.07);
  z-index: 100;
  font-family: Georgia, 'Times New Roman', serif;
  overflow: hidden;
  animation: popIn 0.15s ease;
}
@keyframes popIn {
  from { opacity: 0; transform: translateY(-4px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
#popup-bar { height: 7px; }
#popup-inner { padding: 13px 14px 15px; }
#popup-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 8px;
}
#popup-title {
  font-weight: bold;
  font-size: 12.5px;
  color: #1a1a1a;
  line-height: 1.35;
}
#popup-close {
  cursor: pointer;
  font-size: 20px;
  color: #bbb;
  line-height: 1;
  flex-shrink: 0;
  user-select: none;
}
#popup-close:hover { color: #555; }
#popup-content {
  font-size: 11.5px;
  color: #454545;
  line-height: 1.68;
}
</style>
</head>

<script>
const popupData = {

  'node-atmosphere': {
    color: '#5B8FA8',
    title: 'A Paradox in Every Breath',
    content: "Nitrogen makes up 78% of Earth's atmosphere, far more than any other gas. Yet almost none of it is directly available to living things. The nitrogen molecule (N₂) is held together by an exceptionally strong triple bond, requiring enormous energy to break. The result is a paradox: nitrogen is everywhere, yet nearly always out of reach.\n\nAll the nitrogen in proteins, DNA, and chlorophyll on Earth began its biological journey inside a bacterial cell that can break that bond. Without those bacteria, the atmospheric reservoir would be permanently locked."
  },

  'node-soilfixers': {
    color: '#C8914A',
    title: 'The Root Partnership',
    content: "Soil bacteria, including those in root nodules of legumes, perform nitrogen fixation, one of the most energy-demanding reactions in biology. Using an enzyme called nitrogenase, they break N₂'s triple bond at ordinary temperatures and pressures.\n\nPlants supply these bacteria with sugars and receive usable nitrogen in return. This is why rotating crops with legumes restores soil fertility, a principle Indigenous agricultural systems, including the Three Sisters, applied for centuries."
  },

  'node-cyanobacteria': {
    color: '#C8914A',
    title: 'Fixing Nitrogen in the Open Ocean',
    content: "Marine cyanobacteria such as Trichodesmium and Crocosphaera fix nitrogen in the open ocean, where nutrients are scarce and nitrogen often limits photosynthesis. Trichodesmium forms visible surface blooms across tropical seas and fixes an estimated 50–100 million metric tons of nitrogen per year.\n\nThese organisms face a particular challenge: nitrogenase is destroyed by oxygen, yet cyanobacteria photosynthesize and produce it. They solve this by fixing nitrogen in specialized cells or only at night, an elegant workaround to conflicting chemical requirements."
  },

  'node-npool': {
    color: '#7A9A5C',
    title: 'The Soil Nitrogen Pool',
    content: "Before fixed nitrogen can reach plant roots, nitrifying bacteria convert ammonia first to nitrite, then to nitrate. This transformation produces forms of nitrogen that move freely through soil water where roots can intercept them.\n\nThe pool is in constant flux, with inputs from fixation and decomposition and losses through plant uptake and denitrification. Nitrate can also leach out of soil with water, carrying nitrogen into groundwater and streams. Its size at any moment shapes how productive an ecosystem can be."
  },

  'node-plants': {
    color: '#2A9D8F',
    title: 'Nitrogen at the Core of Every Cell',
    content: "Nitrogen is the element most often limiting plant growth. Plants absorb ammonium and nitrate through specialized root proteins and convert them into amino acids, proteins, and nucleotides, the building blocks of every living cell.\n\nChlorophyll itself contains nitrogen, which is why nitrogen-starved plants turn yellow: they break down their own chlorophyll to recover nitrogen when none is available in soil. Many plants enhance nitrogen acquisition through mycorrhizal partnerships, extending their effective reach into soil volumes inaccessible to root hairs alone."
  },

  'node-animals': {
    color: '#2A9D8F',
    title: 'Nitrogen Borrowed from Food',
    content: "Animals acquire all their nitrogen through food. They break down dietary proteins into amino acids, rebuild them into their own proteins, and excrete excess nitrogen as urea or uric acid, returning it to the soil.\n\nSome animals are key nitrogen vectors across ecosystems. Pacific salmon carry marine-derived nitrogen far inland when they spawn and die in freshwater rivers, fertilizing riverside forests with ocean nutrients. Seabirds concentrate marine nitrogen into coastal soils through guano."
  },

  'node-decomposers': {
    color: '#2A9D8F',
    title: 'Mineralization: Unlocking Organic Nitrogen',
    content: "When organisms die, the nitrogen locked in their proteins does not disappear. Decomposers break proteins into amino acids, then into ammonium, a process called mineralization. The speed depends on the carbon-to-nitrogen ratio of the material: nitrogen-rich matter decomposes quickly, while woody material releases nitrogen slowly.\n\nDecomposers effectively control the rate at which nitrogen cycles back into the soil pool, shaping ecosystem productivity across timescales from weeks to centuries."
  },

  'node-denitrifiers': {
    color: '#C8914A',
    title: 'Completing the Cycle',
    content: "Denitrifying bacteria convert nitrate back into N₂ gas in oxygen-poor environments such as wetlands, waterlogged soils, and deep ocean sediments, where they use nitrate instead of oxygen for respiration.\n\nDuring this process, they often produce nitrous oxide (N₂O), a greenhouse gas about 270 times more potent than CO₂ over a 100-year period. This links soil conditions and land use directly to atmospheric change."
  },

  'arrow-fixation': {
    color: '#C8914A',
    title: 'Nitrogen Fixation: Breaking the Triple Bond',
    content: "Nitrogen fixation makes atmospheric N₂ available to living systems. The enzyme nitrogenase breaks the triple bond and converts nitrogen into ammonia, a process that requires large amounts of energy.\n\nOnly a small group of bacteria and archaea can perform this reaction. Their role is so essential that if all nitrogen fixers were removed from Earth's ecosystems, the nitrogen pool available to life would steadily decline over time."
  },

  'arrow-nitrification': {
    color: '#2A9D8F',
    title: 'Nitrification: Making Nitrogen Mobile',
    content: "Nitrifying bacteria convert ammonia into nitrite and then nitrate. These transformations release energy that the bacteria use to grow.\n\nThis process produces mobile forms of nitrogen that move through soil water and can be absorbed by plants, which take up nitrogen primarily as ammonium or nitrate."
  },

  'arrow-plantuptake': {
    color: '#2A9D8F',
    title: 'Nitrogen Entering the Food Web',
    content: "Plants absorb ammonium and nitrate through active transport proteins in root cell membranes, spending energy to move ions against concentration gradients. Once inside, nitrogen is assembled into amino acids using carbon skeletons from photosynthesis.\n\nThis is the moment nitrogen enters the food web. Every protein in every animal on Earth traces its nitrogen back through this step, with plant roots pulling ions from soil water and incorporating them into the molecules of life."
  },

  'arrow-consumption': {
    color: '#2A9D8F',
    title: 'Nitrogen Through Food Chains',
    content: "When animals eat plants or other animals, nitrogen moves through food webs as proteins and nucleotides. At each step, animals use some nitrogen to build their own tissues and excrete the rest as urea or uric acid, returning it to the soil.\n\nUnlike carbon, nitrogen does not typically return to the atmosphere at each trophic step; it stays in biological circulation until denitrifying bacteria convert it back to N₂, allowing it to cycle through many organisms before finally leaving the food web."
  },

  'arrow-death': {
    color: '#2A9D8F',
    title: 'Returning Nitrogen to the Soil',
    content: "When organisms die or excrete waste, their nitrogen enters the decomposer pathway in organic forms: proteins, urea, and nucleotides. The partially decomposed material that accumulates over time, called humus, holds nitrogen in stable forms that release slowly back into the soil pool. Globally, soil organic matter holds more nitrogen than the atmosphere.\n\nAnimal excretion returns nitrogen to soil throughout an organism's life, often in forms rapidly available to plants. Dead leaves and woody material cycle more slowly, sometimes persisting for years before decomposers fully mineralize their nitrogen content."
  },

  'arrow-mineralization': {
    color: '#2A9D8F',
    title: 'Mineralization: The Return Pathway',
    content: "Decomposers convert organic nitrogen back to ammonium through mineralization, completing the biological loop. The rate of this process determines how quickly nitrogen becomes available again for plant growth.\n\nIn warm, moist tropical forests, mineralization happens so rapidly that little nitrogen accumulates in soil organic matter; most is held in living tissue at any moment. In cold or dry ecosystems, organic nitrogen can persist for centuries, creating peat and humus deposits that represent long-term nitrogen storage."
  },

  'arrow-denitrification': {
    color: '#C8914A',
    title: 'Denitrification: The Critical Exit',
    content: "Denitrifying bacteria use nitrate as a substitute for oxygen during respiration, producing N₂ gas that escapes to the atmosphere. Without this step, nitrogen would accumulate in soils and water as nitrate, reaching concentrations that can disrupt ecosystems.\n\nNatural wetlands are among Earth's most important denitrification sites, helping remove excess nitrogen from water systems and limiting algal blooms. This service is lost when wetlands are drained."
  },

  'arrow-return': {
    color: '#C8914A',
    title: 'Closing the Cycle',
    content: "The return of N₂ to the atmosphere closes the nitrogen cycle and maintains the atmospheric reservoir. The balance between fixation and denitrification has kept atmospheric nitrogen levels relatively stable over long timescales.\n\nThis balance emerges from the combined activity of many microbes responding to local conditions, showing how biological processes operating at the smallest scale shape chemistry at a global one."
  }

};

function showPopup(id, event) {
  event.stopPropagation();
  const data = popupData[id];
  if (!data) return;

  document.getElementById('popup-bar').style.background = data.color;
  document.getElementById('popup-title').textContent = data.title;
  const contentEl = document.getElementById('popup-content');
  contentEl.innerHTML = data.content
    .split('\n\n')
    .map(p => `<p style="margin-bottom:7px">${p}</p>`)
    .join('');

  const popup = document.getElementById('popup');
  const container = document.getElementById('diagram-container');
  const cRect = container.getBoundingClientRect();

  let x = event.clientX - cRect.left;
  let y = event.clientY - cRect.top;

  const pw = 262, ph = 200;
  x = (x + pw + 18 > cRect.width) ? x - pw - 12 : x + 14;
  y = Math.max(6, Math.min(y - 20, cRect.height - ph - 6));

  popup.style.left = x + 'px';
  popup.style.top  = y + 'px';
  popup.style.display = 'block';
}

function closePopup() {
  document.getElementById('popup').style.display = 'none';
}

document.getElementById('diagram-container').addEventListener('click', function(e) {
  const popup = document.getElementById('popup');
  if (popup.style.display !== 'none' && !popup.contains(e.target)) {
    closePopup();
  }
});
</script>
